name: real-vivado-windows-smoke

on:
  workflow_dispatch:
    inputs:
      vivado_path:
        description: Optional full path, bin directory, or Vivado version directory
        required: false
        type: string

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, vivado]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip

      - run: python -m pip install .

      - name: Run diagnostics against installed Vivado
        shell: pwsh
        env:
          REQUESTED_VIVADO_PATH: ${{ inputs.vivado_path }}
        run: |
          if ($env:REQUESTED_VIVADO_PATH) {
            $env:VIVADO_PATH = $env:REQUESTED_VIVADO_PATH
          }

          vivado-mcp-doctor --timeout 300 --json |
            Tee-Object -FilePath vivado-doctor.json

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivado-doctor-windows
          path: vivado-doctor.json
          if-no-files-found: warn
